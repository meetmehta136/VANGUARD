server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: vanguard-ingest
  datasource:
    url: jdbc:postgresql://localhost:5433/vanguard
    username: vanguard
    password: vanguard123
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      ack-mode: MANUAL_IMMEDIATE
    producer:
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.vanguard.common
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.vanguard.common.ScoredTransaction
      enable-auto-commit: false
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    tags:
      application: vanguard-ingest
