scrape_configs:
  - job_name: 'vanguard-ingest'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8081']
  - job_name: 'vanguard-scoring'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8082']
  - job_name: 'vanguard-limiter'
    scrape_interval: 5s
    static_configs:
      - targets: ['host.docker.internal:8083']
